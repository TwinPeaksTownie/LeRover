<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Overlander 4 Touch Controller</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #000000;
            color: #ffffff;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            display: flex;
            padding: 0;
        }

        /* Left Navigation Rail (120px Wide, 480px Full Height) */
        .left-rail {
            width: 130px;
            height: 100vh;
            background: #0d0d0d;
            border-right: 3px solid #222222;
            display: flex;
            flex-direction: column;
            gap: 6px;
            padding: 6px;
            flex-shrink: 0;
        }

        .rail-btn {
            flex: 1;
            background: #181818;
            border: 2px solid #333333;
            color: #888888;
            font-size: 15px;
            font-weight: 900;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            gap: 4px;
        }

        .rail-btn.active {
            background: #00e5ff;
            color: #000000;
            border-color: #00e5ff;
        }

        /* Main Workspace (670px Wide x 480px Tall) */
        .workspace {
            flex-grow: 1;
            height: 100vh;
            display: flex;
            flex-direction: column;
            padding: 10px;
            gap: 10px;
        }

        .tab-panel {
            display: none;
            width: 100%;
            height: 100%;
            flex-direction: column;
            gap: 10px;
        }

        .tab-panel.active {
            display: flex;
        }

        /* Top Header Readout Bar */
        .header-bar {
            height: 48px;
            background: #111111;
            border: 2px solid #333333;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 14px;
            flex-shrink: 0;
        }

        .header-title {
            font-size: 16px;
            font-weight: 900;
            color: #00e5ff;
        }

        .header-readout {
            font-family: monospace;
            font-size: 24px;
            font-weight: 900;
            color: #f8d800;
        }

        /* Massive 130px+ Tall Action Grid */
        .giant-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            flex-grow: 1;
        }

        .btn-action {
            background: #181818;
            border: 3px solid #444444;
            color: #ffffff;
            font-size: 22px;
            font-weight: 900;
            border-radius: 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 12px;
            line-height: 1.2;
        }

        .btn-action:active {
            background: #00e5ff;
            color: #000000;
            border-color: #00e5ff;
        }

        .btn-orange {
            border-color: #ff9900;
            color: #ff9900;
            background: #1e1200;
        }

        .btn-orange:active {
            background: #ff9900;
            color: #000000;
        }

        .btn-red {
            border-color: #ff3344;
            color: #ff3344;
            background: #220000;
        }

        .btn-red:active {
            background: #ff3344;
            color: #ffffff;
        }
    </style>
</head>
<body>

    <!-- Left Vertical Navigation Rail (130px Wide x 480px Tall) -->
    <div class="left-rail">
        <button id="railBtnGantry" class="rail-btn active" onclick="switchTab('gantry')">
            <span style="font-size: 24px;">⚙️</span>
            <span>GANTRY</span>
        </button>

        <button id="railBtnControls" class="rail-btn" onclick="switchTab('controls')">
            <span style="font-size: 24px;">🦾</span>
            <span>TELEOP</span>
        </button>

        <button id="railBtnPower" class="rail-btn" onclick="switchTab('power')">
            <span style="font-size: 24px;">⚡</span>
            <span>POWER</span>
        </button>
    </div>

    <!-- Main Unobstructed Workspace -->
    <div class="workspace">

        <!-- TAB 1: ⚙️ GANTRY SLIDE (Motor 8 Stepper) -->
        <div id="panelGantry" class="tab-panel active">
            <div class="header-bar">
                <div class="header-title">LESLIDE CARRIAGE (MOTOR 8)</div>
                <div id="sliderValDisplay" class="header-readout">2503 ticks</div>
            </div>

            <div class="giant-grid">
                <button class="btn-action" onclick="nudgeSlider(-5)">◀ STEP LEFT<br>(-5 TICKS)</button>
                <button class="btn-action" onclick="nudgeSlider(5)">STEP RIGHT ▶<br>(+5 TICKS)</button>

                <button class="btn-action btn-orange" onclick="syncGantryLeft()">🛑 SYNC LEFT<br>HARD STOP (3)</button>
                <button class="btn-action btn-orange" onclick="syncGantryRight()">🛑 SYNC RIGHT<br>HARD STOP (4800)</button>
            </div>
        </div>

        <!-- TAB 2: 🦾 TELEOP CONTROLLERS -->
        <div id="panelControls" class="tab-panel">
            <div class="header-bar">
                <div class="header-title">TELEOPERATION CONTROLLERS</div>
                <div id="teleopStatus" class="header-readout" style="font-size: 16px; color: #00ff66;">READY</div>
            </div>

            <div class="giant-grid" style="grid-template-columns: repeat(3, 1fr);">
                <button id="leaderBtn" class="btn-action" onclick="toggleMacLeader()">🍎<br>START LEADER</button>
                <button id="followerBtn" class="btn-action" onclick="togglePi500Follower()">🦾<br>START FOLLOWER</button>
                <button id="pokeballBtn" class="btn-action btn-red" onclick="togglePokeballTeleop()">🔴<br>CONNECT POKÉBALL</button>
            </div>
        
            <!-- LIVE POKEBALL TELEMETRY DISPLAY -->
            <div id="pbTelemetryBox" style="background: #111; border: 2px solid #333; border-radius: 10px; padding: 12px; margin-top: 10px; display: flex; flex-direction: column; gap: 8px;">
                <div style="display: flex; justify-content: space-between; align-items: center;">
                    <span style="font-size: 14px; font-weight: 900; color: #ff3344;">🎮 POKÉBALL BLE TELEMETRY</span>
                    <span id="pbConnectBadge" style="font-size: 13px; font-weight: 900; padding: 4px 10px; border-radius: 6px; background: #222; color: #888;">DISCONNECTED</span>
                </div>
                <div style="display: flex; justify-content: space-between; font-family: monospace; font-size: 14px;">
                    <div>Joystick (X,Y): <span id="pbJoyReadout" style="color: #00e5ff; font-weight: 900;">0.00, 0.00</span></div>
                    <div>Packets: <span id="pbPktReadout" style="color: #00ff66; font-weight: 900;">0</span></div>
                </div>
                <div style="display: flex; gap: 12px; align-items: center; font-size: 12px; font-weight: 900;">
                    <span id="pbBtnA" style="padding: 4px 10px; border-radius: 6px; background: #222; color: #666;">Button A (Click)</span>
                    <span id="pbBtnB" style="padding: 4px 10px; border-radius: 6px; background: #222; color: #666;">Button B (Top Red)</span>
                </div>
            </div>
        </div>

        <!-- TAB 3: ⚡ POWER & TOOLS -->
        <div id="panelPower" class="tab-panel">
            <div class="header-bar">
                <div class="header-title">SYSTEM POWER & DIAGNOSTICS</div>
                <div id="powerStatus" class="header-readout" style="font-size: 16px; color: #00ff66;">PI 500 ONLINE</div>
            </div>

            <div class="giant-grid">
                <button class="btn-action btn-red" onclick="triggerPi500PowerOn()">⚡ WAKE PI 500<br>(WAKE-ON-LAN)</button>
                <button class="btn-action" style="cursor: default; opacity: 0.8;">🔒 MATRIX LOCKED<br>(0 1 0 1 0 0)</button>
            </div>
        </div>

    </div>

    <script>
        let currentVerifiedPos = 2503;
        let isLeaderRunning = false;
        let isFollowerRunning = false;
        let isPokeballRunning = false;

        function switchTab(tabId) {
            document.querySelectorAll('.rail-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));

            if (tabId === 'gantry') {
                document.getElementById('railBtnGantry').classList.add('active');
                document.getElementById('panelGantry').classList.add('active');
            } else if (tabId === 'controls') {
                document.getElementById('railBtnControls').classList.add('active');
                document.getElementById('panelControls').classList.add('active');
            } else if (tabId === 'power') {
                document.getElementById('railBtnPower').classList.add('active');
                document.getElementById('panelPower').classList.add('active');
            }
        }

        function setHeaderAlert(msg) {
            const el = document.getElementById('sliderValDisplay');
            if (el) {
                el.innerText = '⚡ ' + (msg || '12V POWER OFF');
                el.style.color = '#ff3344';
            }
        }

        function pollTelemetry() {
            fetch('/api/status')
                .then(r => {
                    if (!r.ok) {
                        setHeaderAlert('12V POWER OFF');
                        return null;
                    }
                    return r.json();
                })
                .then(data => {
                    if (!data) return;
                    // 1. Process Telemetry Readout
                    if (data.closed_loop_verified && data.hardware_telemetry) {
                        if (data.hardware_telemetry.hardware_connected === false || (data.hardware_telemetry.error && data.hardware_telemetry.error.includes("12V"))) {
                            setHeaderAlert('12V POWER OFF');
                        } else if (data.hardware_telemetry.servos && data.hardware_telemetry.servos['8']) {
                            const m8 = data.hardware_telemetry.servos['8'];
                            if (m8.pos !== undefined) {
                                currentVerifiedPos = m8.pos;
                                document.getElementById('sliderValDisplay').innerText = m8.pos + ' ticks (VERIFIED)';
                                document.getElementById('sliderValDisplay').style.color = '#00ff66';
                            }
                        }
                    } else if (!data.pi500_online) {
                        document.getElementById('sliderValDisplay').innerText = 'PI 500 OFFLINE';
                        document.getElementById('sliderValDisplay').style.color = '#ff3344';
                    } else {
                        setHeaderAlert('12V POWER OFF');
                    }

                    // 2. Process Process States
                    isFollowerRunning = data.follower && data.follower.running;
                    isLeaderRunning = data.leader && data.leader.running;
                    
                    const pkData = data.pokeball || {};
                    isPokeballRunning = pkData.running;
                    const isPokeballConnected = pkData.connected;
                    const pkTelem = pkData.telemetry || (data.hardware_telemetry && data.hardware_telemetry.pokeball);

                    // Parse Pokeball Live Telemetry & Badge
                    if (pkTelem || pkData) {
                        const badge = document.getElementById('pbConnectBadge');
                        const joy = document.getElementById('pbJoyReadout');
                        const pkt = document.getElementById('pbPktReadout');
                        const btnA = document.getElementById('pbBtnA');
                        const btnB = document.getElementById('pbBtnB');

                        if (badge) {
                            if (isPokeballConnected) {
                                badge.innerText = '🟢 CONNECTED';
                                badge.style.background = 'rgba(0,255,102,0.2)';
                                badge.style.color = '#00ff66';
                            } else if (isPokeballRunning) {
                                badge.innerText = '🟡 SEARCHING...';
                                badge.style.background = 'rgba(255,170,0,0.2)';
                                badge.style.color = '#ffaa00';
                            } else {
                                badge.innerText = '🔴 DISCONNECTED';
                                badge.style.background = 'rgba(255,51,68,0.2)';
                                badge.style.color = '#ff3344';
                            }
                        }

                        if (joy && pkTelem) joy.innerText = `${(pkTelem.norm_x || 0).toFixed(2)}, ${(pkTelem.norm_y || 0).toFixed(2)}`;
                        if (pkt && pkTelem) pkt.innerText = pkTelem.packet_count || 0;
                        
                        if (btnA && pkTelem) {
                            btnA.style.background = pkTelem.button_a ? '#00ff66' : '#222';
                            btnA.style.color = pkTelem.button_a ? '#000' : '#666';
                        }
                        if (btnB && pkTelem) {
                            btnB.style.background = pkTelem.button_b ? '#ff3344' : '#222';
                            btnB.style.color = pkTelem.button_b ? '#fff' : '#666';
                        }
                    }

                    const followerBtn = document.getElementById('followerBtn');
                    if (followerBtn) {
                        followerBtn.style.borderColor = isFollowerRunning ? '#00ff66' : '#444444';
                        followerBtn.style.color = isFollowerRunning ? '#00ff66' : '#ffffff';
                        followerBtn.innerHTML = isFollowerRunning ? '🦾<br>STOP FOLLOWER' : '🦾<br>START FOLLOWER';
                    }

                    const pokeballBtn = document.getElementById('pokeballBtn');
                    if (pokeballBtn) {
                        if (!isPokeballRunning) {
                            pokeballBtn.style.borderColor = '#ff3344';
                            pokeballBtn.style.color = '#ff3344';
                            pokeballBtn.style.background = 'rgba(255, 51, 68, 0.1)';
                            pokeballBtn.innerHTML = '🔴<br>START POKÉBALL';
                        } else if (isPokeballConnected) {
                            pokeballBtn.style.borderColor = '#00ff66';
                            pokeballBtn.style.color = '#00ff66';
                            pokeballBtn.style.background = 'rgba(0, 255, 102, 0.15)';
                            pokeballBtn.innerHTML = '🟢<br>POKÉBALL CONNECTED<br><span style="font-size:11px; font-weight:normal; color:#aaffcc;">(Click to Stop)</span>';
                        } else {
                            pokeballBtn.style.borderColor = '#ffaa00';
                            pokeballBtn.style.color = '#ffaa00';
                            pokeballBtn.style.background = 'rgba(255, 170, 0, 0.15)';
                            pokeballBtn.innerHTML = '🟡<br>SEARCHING BLE...<br><span style="font-size:11px; font-weight:normal; color:#ffddaa;">Press Button to Wake</span>';
                        }
                    }

                    const leaderBtn = document.getElementById('leaderBtn');
                    if (leaderBtn) {
                        leaderBtn.style.borderColor = isLeaderRunning ? '#00e5ff' : '#444444';
                        leaderBtn.style.color = isLeaderRunning ? '#00e5ff' : '#ffffff';
                        leaderBtn.innerHTML = isLeaderRunning ? '🍎<br>STOP LEADER' : '🍎<br>START LEADER';
                    }

                    // 3. Power status
                    const pStatus = document.getElementById('powerStatus');
                    if (pStatus) {
                        pStatus.innerText = data.pi500_online ? 'PI 500 ONLINE' : 'PI 500 OFFLINE';
                        pStatus.style.color = data.pi500_online ? '#00ff66' : '#ff3344';
                    }
                })
                .catch(() => setHeaderAlert('12V POWER OFF'));
        }

        setInterval(pollTelemetry, 600);
        pollTelemetry();

        function sendSliderMove(targetVal) {
            document.getElementById('sliderValDisplay').innerText = targetVal + ' ticks (SENDING...)';
            document.getElementById('sliderValDisplay').style.color = '#f8d800';
            fetch('/api/slider', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ id: 8, target: parseInt(targetVal) })
            })
            .then(r => {
                if (!r.ok) {
                    setHeaderAlert('12V POWER OFF');
                } else {
                    setTimeout(pollTelemetry, 150);
                }
            })
            .catch(() => setHeaderAlert('12V POWER OFF'));
        }

        function nudgeSlider(delta) {
            let targetVal = currentVerifiedPos + delta;
            targetVal = Math.max(3, Math.min(4800, targetVal));
            sendSliderMove(targetVal);
        }

        function syncGantryLeft() {
            document.getElementById('sliderValDisplay').innerText = 'SYNCING LEFT...';
            document.getElementById('sliderValDisplay').style.color = '#ff9900';
            fetch('/api/sync_position', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ id: 8, pos: 3 })
            })
            .then(r => {
                if (!r.ok) {
                    setHeaderAlert('12V POWER OFF');
                } else {
                    setTimeout(pollTelemetry, 250);
                }
            })
            .catch(() => setHeaderAlert('12V POWER OFF'));
        }

        function syncGantryRight() {
            document.getElementById('sliderValDisplay').innerText = 'SYNCING RIGHT...';
            document.getElementById('sliderValDisplay').style.color = '#ff9900';
            fetch('/api/sync_position', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ id: 8, pos: 4800 })
            })
            .then(r => {
                if (!r.ok) {
                    setHeaderAlert('12V POWER OFF');
                } else {
                    setTimeout(pollTelemetry, 250);
                }
            })
            .catch(() => setHeaderAlert('12V POWER OFF'));
        }

        function toggleMacLeader() {
            const action = isLeaderRunning ? 'stop' : 'start';
            fetch('/api/mac_leader_toggle', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ action: action })
            }).then(() => setTimeout(pollTelemetry, 300));
        }

        function togglePi500Follower() {
            const action = isFollowerRunning ? 'stop' : 'start';
            fetch('/api/pi500_follower_toggle', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ action: action })
            }).then(() => setTimeout(pollTelemetry, 300));
        }

        function togglePokeballTeleop() {
            const action = isPokeballRunning ? 'stop' : 'start';
            fetch('/api/pokeball_teleop_toggle', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ action: action })
            }).then(() => setTimeout(pollTelemetry, 300));
        }

        function triggerPi500PowerOn() {
            fetch('/api/pi500_poweron', { method: 'POST' }).then(() => setTimeout(pollTelemetry, 500));
        }
    </script>
</body>
</html>
